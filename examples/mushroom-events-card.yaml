type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    primary: Wydarzenia w Warszawie
    icon: mdi:calendar-star
    icon_color: teal
    card_mod:
      style: |
        ha-card {
          border-radius: 16px;
        }

  - type: custom:mushroom-template-card
    entity: sensor.events
    primary: >-
      {% set ev = state_attr('sensor.events','events') or [] %}
      {{ ev[0].title if ev|count > 0 else 'Brak wydarzeń' }}
    secondary: >-
      {% set ev = state_attr('sensor.events','events') or [] %}
      {% if ev|count > 0 %}
        {{ ev[0].date or '' }}
        {% if ev[0].place %} • {{ ev[0].place }}{% endif %}
      {% endif %}
    icon: mdi:calendar-check
    multiline_secondary: true
    tap_action:
      action: url
      url_path: >-
        {% set ev = state_attr('sensor.events','events') or [] %}
        {{ ev[0].url if ev|count > 0 else '' }}
    card_mod:
      style: |
        ha-card {
          background: rgba(76,175,80,0.20) !important;
          border-left: 6px solid rgb(76,175,80);
          border-radius: 12px;
        }

